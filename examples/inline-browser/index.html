<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walking guides — inline search</title>
  <link rel="stylesheet" href="{{BASE}}assets/main.css">
</head>
<body><main>
  <p class="eyebrow">Field notes</p>
  <h1>Find your next step</h1>
  <p>Search practical walking guides, or browse all the pages below.</p>
  <p data-search-status role="status">Browse the guides below. Search needs JavaScript.</p>
  <button type="button" data-search-retry hidden>Retry loading search</button>
  <section data-search-root aria-label="Guide search"><p>Search will appear here. The guide links below are always available.</p></section>
  <noscript><p>JavaScript is off. Browse the complete guide list below.</p></noscript>
  <nav aria-label="Browse all guides"><h2>All guides</h2><ul>{{BROWSE_LINKS}}</ul></nav>
</main><script type="module" src="{{BASE}}assets/main.js"></script></body>
</html>
