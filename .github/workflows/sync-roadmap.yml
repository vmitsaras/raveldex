name: Sync roadmap tracking

on:
  push:
    branches: [main]
    paths:
      - docs/planning/roadmap.json
      - IMPLEMENTATION_TASKS.md
      - scripts/link-native-subissues.mjs
      - scripts/sync-github.mjs
      - scripts/lib/roadmap.mjs
      - .github/workflows/sync-roadmap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raveldex-roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'vmitsaras/raveldex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      RAVELDEX_UI_BROWSER: chromium
      RAVELDEX_WORKER_BROWSER: chromium
      RAVELDEX_INDEXEDDB_BROWSER: chromium
      RAVELDEX_CANDIDATE_BROWSER: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/RX-4002-gc-shrink-raw-*-20261028.tar.xz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run check
      - name: Create or update repository milestones and task issues
        run: npm run tracking:sync
      - name: Link N9 task issues as native GitHub sub-issues
        run: node scripts/link-native-subissues.mjs --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
