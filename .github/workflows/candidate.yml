name: Prepare private candidate

# Manual verification only. This workflow has no publication or tag step.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Verify candidate on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      RAVELDEX_UI_BROWSER: chromium
      RAVELDEX_WORKER_BROWSER: chromium
      RAVELDEX_INDEXEDDB_BROWSER: chromium
      RAVELDEX_CANDIDATE_BROWSER: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/RX-4002-gc-shrink-raw-*-20261028.tar.xz
      - name: Record available runner storage
        run: df -h .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify, pack and exercise the private candidate
        run: npm run candidate:prepare -- --output "${{ runner.temp }}/raveldex-candidate"
      - name: Preserve candidate reports and tarball
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raveldex-candidate-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/raveldex-candidate/*.json
            ${{ runner.temp }}/raveldex-candidate/*.log
            ${{ runner.temp }}/raveldex-candidate/*.tgz
          if-no-files-found: ignore
          retention-days: 7
