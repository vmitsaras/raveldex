name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tooling, core, UI, worker, snapshot and storage checks (not release qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAVELDEX_UI_BROWSER: chromium
      RAVELDEX_WORKER_BROWSER: chromium
      RAVELDEX_INDEXEDDB_BROWSER: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run check
      - run: npm run tracking:preview
