name: Reproducible defect
description: Report observed behavior with an explicit expected result.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction and actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and contract reference
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Package commit/version, environment, and optional modules
    validations:
      required: true
