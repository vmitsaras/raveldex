name: Bounded implementation task
description: Propose a scoped task with observable acceptance and verification.
title: "[RX-] "
labels: ["type:task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Problem and intended outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, affected paths, and exclusions
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and governing specifications
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification method and evidence destination
    validations:
      required: true
